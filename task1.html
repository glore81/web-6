    <div class="container py-4">
        <h2 class="fw-bold mb-3">Task 1: Selectors & CSS</h2>
        <div class="card p-4 shadow-sm mb-3" style="max-width: 600px;">
            <h4 id="main-title">Original Title (#id selector)</h4>
            <p class="description">Original description paragraph (.class selector)</p>
            <span>Tag selector element (&lt;span&gt;)</span>
        </div>
        <button id="apply-btn" class="btn btn-dark">Apply Selector Changes</button>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {$("#apply-btn").click(function() {
                $("#main-title").text("Title modified with .text()").css("color", "#dc3545");
                $(".description").html("Text updated with <u><strong>.html()</strong></u>").css("font-size", "1.2rem");
                $("span").css({
                    "background-color": "#ffc107",
                    "padding": "6px 12px",
                    "border-radius": "4px",
                    "display": "inline-block"
                });
            });
        });
    </script>
